name: Validate SYN_LAUNCH
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile main.py
      - name: Validate bootstrap shell syntax
        run: bash -n install.sh
      - name: Validate catalog JSON
        run: python -m json.tool catalog.json > /dev/null
      - name: Validate catalog and security checks
        run: python -m unittest discover -s tests -v
      - name: Run environment check
        run: python main.py --check
      - name: Check CLI search
        run: python main.py --search Nuclei
