          assert report["summary"]["catalog_entries"] == 269, report["summary"]
          assert report["summary"]["compatibility_assessed_entries"] >= 221, report["summary"]
          declared = [tool for tool in report["tools"] if tool["compatibility_assessment"] == "declared_but_not_device_verified"]
