name: Validate SYN_LAUNCH
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Python syntax
        run: python -m py_compile main.py workflow_planner.py workflow_adapters.py
      - name: Validate bootstrap shell syntax
        run: bash -n install.sh
      - name: Validate local device-check script syntax
        run: bash -n device_check.sh
      - name: Validate catalog JSON
        run: python -m json.tool catalog.json > /dev/null
      - name: Validate catalog and security checks
        run: python -m unittest discover -s tests -v
      - name: Run environment check
        run: python main.py --check
      - name: Run explicitly selected bounded Python smoke test
        run: python main.py --smoke-test python
      - name: Validate compatibility report and recorded smoke evidence
        run: |
          python main.py --compatibility-report > compatibility-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("compatibility-report.json").read_text(encoding="utf-8"))
          assert report["report_schema"] == 3, report.get("report_schema")
          assert report["summary"]["catalog_entries"] == 269, report["summary"]
          assert report["summary"]["compatibility_assessed_entries"] >= 132, report["summary"]
          declared = [tool for tool in report["tools"] if tool["compatibility_assessment"] == "declared_but_not_device_verified"]
          assert all(tool["compatibility_metadata"].get("source_revision") and tool["compatibility_metadata"].get("source_snapshot_url") for tool in declared), "compatibility evidence must be revision-pinned"
          for tool_id, source_repo, source_revision in (
              ("xh", "termux-packages", "e85983636adcf748134c3feb1df27f44e78322e1"),
              ("feroxbuster", "termux-packages", "e85983636adcf748134c3feb1df27f44e78322e1"),
              ("curlie", "termux-packages", "e85983636adcf748134c3feb1df27f44e78322e1"),
              ("hping3", "termux-root-packages", "06591fc024101b04095ec4417d51907512b46e3c"),
              ("arp-scan", "termux-root-packages", "06591fc024101b04095ec4417d51907512b46e3c"),
          ):
              tool = next(item for item in report["tools"] if item["id"] == tool_id)
              metadata = tool["compatibility_metadata"]
              assert tool["compatibility_assessment"] == "declared_but_not_device_verified", tool
              assert metadata["source_revision"] == source_revision, tool
              assert source_repo in metadata["source_snapshot_url"], tool
              assert metadata["evidence_scope"], tool
          for tool_id in ("xh", "feroxbuster", "curlie"):
              tool = next(item for item in report["tools"] if item["id"] == tool_id)
              assert tool["install_kind"] == "pkg" and tool["catalog_installable"], tool
          for tool_id in ("hping3", "arp-scan"):
              tool = next(item for item in report["tools"] if item["id"] == tool_id)
              assert not tool["catalog_installable"], tool
          for tool_id in (
              "gitleaks", "cargo-audit", "govulncheck", "strace", "ltrace", "docker-cli",
              "kubectl", "rclone", "restic", "rustscan", "jadx", "apktool", "sslscan",
              "proxychains-ng", "gosec", "rizin", "crunch", "steghide",
          ):
              tool = next(item for item in report["tools"] if item["id"] == tool_id)
              metadata = tool["compatibility_metadata"]
              assert tool["compatibility_assessment"] == "declared_but_not_device_verified", tool
              assert metadata["source_revision"] == "e85983636adcf748134c3feb1df27f44e78322e1", tool
              assert metadata["source_snapshot_url"].endswith("/packages/" + tool_id), tool
              assert tool["install_kind"] == "pkg" and tool["catalog_installable"], tool
          for tool_id in ("iw", "aircrack-ng", "tshark"):
              tool = next(item for item in report["tools"] if item["id"] == tool_id)
              metadata = tool["compatibility_metadata"]
              assert tool["compatibility_assessment"] == "declared_but_not_device_verified", tool
              assert metadata["source_revision"] == "06591fc024101b04095ec4417d51907512b46e3c", tool
              assert metadata["source_snapshot_url"].endswith("/packages/" + tool_id), tool
              assert "termux-root-packages" in metadata["source_snapshot_url"], tool
              assert not tool["catalog_installable"], tool
          nmap = next(tool for tool in report["tools"] if tool["id"] == "nmap")
          assert nmap["compatibility_assessment"] == "declared_but_not_device_verified", nmap
          assert nmap["compatibility_metadata"]["evidence_scope"], nmap
          for tool_id in ("mtr", "tcpdump"):
              tool = next(item for item in report["tools"] if item["id"] == tool_id)
              metadata = tool["compatibility_metadata"]
              assert metadata["source_revision"] == "06591fc024101b04095ec4417d51907512b46e3c", tool
              assert "termux-root-packages" in metadata["source_snapshot_url"], tool
          expected_metadata = {"pip-audit": "upstream Python packaging metadata (pyproject.toml)", "yamllint": "upstream Python packaging metadata (pyproject.toml)", "dirsearch": "upstream Python packaging metadata (pyproject.toml)", "sherlock": "upstream Python packaging metadata (pyproject.toml)", "bandit": "upstream Python packaging metadata (setup.cfg)", "detect-secrets": "upstream Python packaging metadata (setup.py)", "email-validator": "upstream Python packaging metadata (setup.cfg)", "ssh-audit": "upstream Python packaging metadata (setup.cfg)", "maigret": "upstream Python packaging metadata (pyproject.toml)", "h8mail": "upstream Python packaging metadata (setup.py)", "theharvester": "upstream Python packaging metadata (pyproject.toml)", "holehe": "upstream Python packaging metadata (setup.py)", "dnstwist": "upstream Python packaging metadata (setup.py)", "wapiti": "upstream Python packaging metadata (pyproject.toml)", "wfuzz": "upstream Python packaging metadata (setup.py)", "wafw00f": "upstream Python packaging metadata (pyproject.toml)", "arjun": "upstream Python packaging metadata (setup.py)", "hashid": "upstream Python packaging metadata (setup.py)", "passlib": "upstream Python packaging metadata (setup.py)", "bcrypt": "upstream Python packaging metadata (pyproject.toml)", "ropgadget": "upstream Python packaging metadata (setup.py)", "ropper": "upstream Python packaging metadata (pyproject.toml)"}
          for tool_id, evidence_kind in expected_metadata.items():
              tool = next(item for item in report["tools"] if item["id"] == tool_id)
              metadata = tool["compatibility_metadata"]
              assert metadata["evidence_kind"] == evidence_kind, tool
              assert metadata["declared_python_requirement"], tool
          for tool_id in ("mtr", "tcpdump"):
              tool = next(item for item in report["tools"] if item["id"] == tool_id)
              assert tool["compatibility_assessment"] == "declared_but_not_device_verified", tool
              assert tool["compatibility_metadata"]["evidence_scope"], tool
          assert report["summary"]["smoke_tested_entries"] >= 1, report["summary"]
          assert report["summary"]["device_verified_entries"] == 0, report["summary"]
          python_tool = next(tool for tool in report["tools"] if tool["id"] == "python")
          assert python_tool["smoke_test"] == "passed", python_tool
          assert python_tool["device_validation"] == "not_run", python_tool
          print("Compatibility report schema and bounded smoke evidence validated.")
          PY
      - name: Check CLI search
        run: python main.py --search Nuclei
      - name: Exercise local diagnostic bundle on CI runner (not Android device validation)
        run: bash device_check.sh
